plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def totemCoreJar = file(providers.gradleProperty('totemCoreJar')
        .getOrElse('../TotemCore/build/libs/totem-core-0.7.0.jar'))

def observerE2eResults = file("${buildDir}/e2e/results").absolutePath

sourceSets {
    e2e {
        // Compile the test-only driver against production code, while keeping its
        // classes/resources in a distinct Fabric local-mod classpath group.
        compileClasspath += sourceSets.main.output.classesDirs + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

loom {
    mods {
        'totem-vanilla-tweaks' { sourceSet sourceSets.main }
        'totem-vanilla-tweaks-e2e' { sourceSet sourceSets.e2e }
    }
    runs {
        e2eServer {
            server()
            configName = 'Observer E2E Server'
            runDir = 'build/e2e/server'
            // Loom run configurations select one primary SourceSet. Keep production
            // main as the primary run source, then append the E2E mod output to the
            // run task classpath below so Fabric Loader discovers both mod IDs.
            source = sourceSets.main
            vmArg '-Dtotem.observer.e2e.enabled=true'
            vmArg "-Dtotem.observer.e2e.results=${observerE2eResults}"
        }
        e2eTarget {
            client()
            configName = 'Observer E2E Target'
            runDir = 'build/e2e/target'
            source = sourceSets.main
            vmArg '-Dtotem.observer.e2e.enabled=true'
            vmArg '-Dtotem.observer.e2e.role=target'
            vmArg "-Dtotem.observer.e2e.results=${observerE2eResults}"
            programArg '--username'
            programArg 'Target'
            programArg '--quickPlayMultiplayer'
            programArg '127.0.0.1:25570'
        }
        e2eObserver {
            client()
            configName = 'Observer E2E Observer'
            runDir = 'build/e2e/observer'
            source = sourceSets.main
            vmArg '-Dtotem.observer.e2e.enabled=true'
            vmArg '-Dtotem.observer.e2e.role=observer'
            vmArg "-Dtotem.observer.e2e.results=${observerE2eResults}"
            programArg '--username'
            programArg 'Observer'
            programArg '--quickPlayMultiplayer'
            programArg '127.0.0.1:25570'
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'totem-vanilla-tweaks-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files(totemCoreJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.register("normalizeFabricApiTweakersForNamedDevRuntime") {
    group = "fabric"
    description = "Normalizes Fabric API tweaker namespaces for the named development runtime."

    doLast {
        def jarFiles = new LinkedHashSet<File>()
        jarFiles.addAll(configurations.runtimeClasspath.resolve().findAll { file ->
            file.name.endsWith(".jar") && file.absolutePath.contains("${File.separator}net.fabricmc.fabric-api${File.separator}")
        })

        [gradle.gradleUserHomeDir, new File(System.getProperty("user.home"), ".gradle")].each { File cacheRoot ->
            File fabricApiCache = new File(cacheRoot, "caches/modules-2/files-2.1/net.fabricmc.fabric-api")
            if (fabricApiCache.isDirectory()) {
                jarFiles.addAll(fileTree(dir: fabricApiCache, include: "**/*.jar").files.findAll { file ->
                    !file.name.endsWith("-sources.jar")
                })
            }
        }

        int patchedFiles = 0
        int patchedEntries = 0

        jarFiles.each { File jarFile ->
            File tempFile = new File(buildDir, "tmp/tweaker-normalized/${jarFile.name}.tmp")
            tempFile.parentFile.mkdirs()
            boolean fileChanged = false

            def zipFile = new java.util.zip.ZipFile(jarFile)
            def zipOut = new java.util.zip.ZipOutputStream(new java.io.BufferedOutputStream(new java.io.FileOutputStream(tempFile)))

            try {
                def entries = zipFile.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    def outEntry = new java.util.zip.ZipEntry(entry.name)
                    zipOut.putNextEntry(outEntry)

                    byte[] bytes = entry.isDirectory() ? new byte[0] : zipFile.getInputStream(entry).bytes
                    if (!entry.isDirectory() && (entry.name.endsWith(".classtweaker") || entry.name.endsWith(".accesswidener"))) {
                        String text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
                        String normalized = text
                                .replaceFirst(/(?m)^(classTweaker\s+v\d+\s+)official(\s*)$/, '$1named$2')
                                .replaceFirst(/(?m)^(accessWidener\s+v\d+\s+)official(\s*)$/, '$1named$2')

                        if (normalized != text) {
                            bytes = normalized.getBytes(java.nio.charset.StandardCharsets.UTF_8)
                            fileChanged = true
                            patchedEntries++
                        }
                    }

                    zipOut.write(bytes)
                    zipOut.closeEntry()
                }
            } finally {
                zipOut.close()
                zipFile.close()
            }

            if (fileChanged) {
                java.nio.file.Files.move(
                        tempFile.toPath(),
                        jarFile.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                patchedFiles++
            } else {
                tempFile.delete()
            }
        }

        logger.lifecycle("Normalized ${patchedEntries} Fabric API tweaker entries in ${patchedFiles} jars for named dev runtime.")
    }
}

tasks.matching { task ->
    task.name in [
            "runClient", "runServer", "runDatagen", "runGameTest", "runClientGametest",
            "runE2eServer", "runE2eTarget", "runE2eObserver"
    ]
}.configureEach {
    dependsOn("normalizeFabricApiTweakersForNamedDevRuntime")
}

// A Loom run has exactly one primary SourceSet. The E2E runs use main so the
// production mod is discovered normally, then append only the test mod output.
// `loom.mods` above supplies separate classpath groups for both mod IDs.
tasks.matching { task -> task.name in ["runE2eServer", "runE2eTarget", "runE2eObserver"] }.configureEach {
    dependsOn(sourceSets.e2e.classesTaskName, sourceSets.e2e.processResourcesTaskName)
    classpath(sourceSets.e2e.output)
}

tasks.named('runE2eServer').configure {
    doFirst {
        File dir = file('build/e2e/server')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = '''server-port=25570
online-mode=false
enforce-secure-profile=false
spawn-protection=0
view-distance=2
simulation-distance=2
max-players=4
motd=Totem Observer E2E
'''
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    // zh_cn intentionally reuses zh_tw; maintain only the Traditional Chinese source.
    doLast {
        copy {
            from(file('src/main/resources/assets/deadrecall/lang/zh_tw.json'))
            into(file("${destinationDir}/assets/deadrecall/lang"))
            rename { 'zh_cn.json' }
        }
    }
}
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
