name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out TotemVanillaTweaks
        uses: actions/checkout@v4

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 424b90dc3929caa8c1afcfca7e63c50a64bde669
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Mesa software rendering
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libgl1-mesa-glx libglx-mesa0 mesa-utils xserver-xorg-core xserver-xorg-video-dummy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build pinned TotemCore
        shell: bash
        run: |
          set -euo pipefail
          (cd .lockstep/TotemCore && ./gradlew assemble --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace)

      - name: Test and assemble gameplay-only VanillaTweaks
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.23.jar"
          ./gradlew -PtotemCoreJar="$core_jar" clean test assemble compileGametestJava --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.23.jar"
          ./gradlew -PtotemCoreJar="$core_jar" runGameTest --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Run gameplay client GameTest
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.23.jar"
          export SDL_VIDEO_DRIVER=x11
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render +iglx -noreset" ./gradlew -PtotemCoreJar="$core_jar" runClientGametest --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Enforce VanillaTweaks ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = '0.1.30'
          test -f build/libs/totem-vanilla-tweaks-0.1.30.jar
          ! find src/main/java -type f -name 'Observer*.java' | grep -q .
          ! grep -R -n -E '/observeui|Observer(Server|Client)Runtime|dev\.totem\.vanillatweaks\.observer' src/main
          test ! -d src/integrationGametest
          test ! -d src/e2e
          grep -Fq '"OptionsMixin"' src/main/resources/totem-vanilla-tweaks.client.mixins.json
          grep -Fq '"AbstractContainerScreenMixin"' src/main/resources/totem-vanilla-tweaks.client.mixins.json
          test "$(jq '.client | length' src/main/resources/totem-vanilla-tweaks.client.mixins.json)" = '2'
          ! grep -R -n 'Observer' src/main/resources/totem-vanilla-tweaks.mixins.json

      - name: Inspect release artifact ownership
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          jar_file="build/libs/totem-vanilla-tweaks-${version}.jar"
          unzip -Z1 "$jar_file" > build/release-jar-entries.txt
          if grep -E 'dev/totem/vanillatweaks/(observer/|network/Observer|client/Observer|mixin/.*/?Observer|mixin/Observer)' build/release-jar-entries.txt; then
            echo 'Embedded Observer classes remain in the VanillaTweaks artifact.' >&2
            exit 1
          fi
          for member in fabric.mod.json totem-vanilla-tweaks.mixins.json totem-vanilla-tweaks.client.mixins.json; do
            unzip -p "$jar_file" "$member" > build/release-jar-metadata.json
            if grep -q 'Observer' build/release-jar-metadata.json; then
              echo "Embedded Observer metadata remains in ${member}." >&2
              exit 1
            fi
          done

      - name: Bind validated release artifact to this Build
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          core_source="$(git -C .lockstep/TotemCore rev-parse HEAD)"
          test "$core_source" = 424b90dc3929caa8c1afcfca7e63c50a64bde669
          core_sha="$(sha512sum .lockstep/TotemCore/build/libs/totem-core-0.7.23.jar | awk '{print $1}')"
          test "$core_sha" = "$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          test "$sha" = "$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          mkdir -p build/release-artifact
          cp "build/libs/${artifact}" build/release-artifact/
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core_source "$core_source" --arg core_sha "$core_sha" '{repository:$repository,source_commit:$source,run_id:$run,run_attempt:$attempt,version:$version,artifact:$artifact,sha512:$sha,core_version:"0.7.23",core_source_commit:$core_source,core_artifact_sha512:$core_sha}' > build/release-artifact/build-provenance.json

      - name: Upload immutable validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 14
