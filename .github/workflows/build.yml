name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out VanillaTweaks
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 6f0d146379c3e0d7ed8fc6a665fc896c877afb90
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Build TotemCore
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemCore/gradlew gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore jar --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.6.1'
          test -f ".lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"

      - name: Compile and test VanillaTweaks
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./gradlew -PtotemCoreJar="$core_jar" test assemble compileGametestJava --no-daemon --stacktrace

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./gradlew -PtotemCoreJar="$core_jar" runGameTest --no-daemon --stacktrace
