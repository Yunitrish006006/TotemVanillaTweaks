name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out VanillaTweaks
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # A pre-non-remap build rewrote Fabric API access wideners inside the
          # shared Gradle dependency cache. Never restore or persist those
          # historical jars; hosted runners resolve pristine official artifacts.
          cache-disabled: true

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: e9dc2975cca37210f9d3bab2df4830e81af77295
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation compile dependency
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 6b54011195b81ec9a9a09146d162ba303ebd8ee4
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Check out pinned TotemRemnant
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemRemnant
          ref: 954ac6667384b65f45d513d5e9e9d8efd9627266
          path: .lockstep/TotemRemnant
          persist-credentials: false

      - name: Check out pinned TotemAutomata
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemAutomata
          ref: 0fb0833f264a1b2026e8784ca1f412cae2bf690d
          path: .lockstep/TotemAutomata
          persist-credentials: false

      - name: Check out pinned TotemNexus
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemNexus
          ref: d88107984f54aa34c094d297ce647cf45068a132
          path: .lockstep/TotemNexus
          persist-credentials: false

      - name: Check out pinned TotemVillagers
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemVillagers
          ref: 1cca1c7b404be4c4f409f48cdf486e42f8d249a0
          path: .lockstep/TotemVillagers
          persist-credentials: false

      - name: Check out pinned TotemLocksmith
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemLocksmith
          ref: 3c62c42e38b356bf3a834078796dbc8c40f7ad5f
          path: .lockstep/TotemLocksmith
          persist-credentials: false

      - name: Build pinned Observer integration modules
        shell: bash
        run: bash .github/scripts/build-observer-integration-jars.sh

      - name: Compile and test VanillaTweaks
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.12'
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./gradlew -PtotemCoreJar="$core_jar" \
            -PtotemRemnantJar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.15.jar" \
            -PtotemAutomataJar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.17.jar" \
            -PtotemNexusJar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.5.jar" \
            -PtotemVillagersJar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.32.jar" \
            -PtotemLocksmithJar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.5.jar" \
            test assemble compileGametestJava compileE2eJava processE2eResources --no-daemon --stacktrace

      - name: Verify Observer test gate parity
        shell: bash
        run: bash .github/scripts/check-observer-test-gate-parity.sh

      - name: Enforce module-owned Observer screens
        shell: bash
        run: bash .github/scripts/check-owned-observer-screens.sh

      - name: Assert Observer production source is framebuffer-free
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Screenshot\.takeScreenshot|FrameChunk|FrameRelay|DynamicTexture|ObserverFrameRules|observer_frame_chunk|observer_frame_relay|observer_capture_control'
          if grep -R -n -E "$forbidden" src/main; then
            echo 'Protocol-native Observer production source still contains framebuffer transport code.' >&2
            exit 1
          fi

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./gradlew -PtotemCoreJar="$core_jar" runGameTest --no-daemon --stacktrace

      - name: Run client GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          xvfb-run -a ./gradlew -PtotemCoreJar="$core_jar" runClientGametest --no-daemon --stacktrace

      - name: Run cross-module production sender Client GameTest
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.12.jar"
          xvfb-run -a ./gradlew \
            -PtotemCoreJar="$core_jar" \
            -PtotemRemnantJar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.15.jar" \
            -PtotemAutomataJar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.17.jar" \
            -PtotemNexusJar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.5.jar" \
            -PtotemVillagersJar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.32.jar" \
            -PtotemLocksmithJar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.5.jar" \
            runIntegrationClientGametest --no-daemon --stacktrace

      - name: Verify cross-module integration screenshots
        shell: bash
        run: |
          set -euo pipefail
          integration_screenshots="${GITHUB_WORKSPACE}/build/owner-present-integration-screenshots"
          count="$(find "$integration_screenshots" -maxdepth 1 -type f -name '*.png' | wc -l)"
          if [[ "$count" != 8 ]]; then
            echo "Expected exactly 8 owner-present screenshots; found $count." >&2
            exit 1
          fi

      - name: Upload cross-module integration screenshots
        uses: actions/upload-artifact@v4
        with:
          name: observer-owner-present-integration-screenshots
          path: build/owner-present-integration-screenshots/*.png
          if-no-files-found: error

      - name: Run dedicated-server two-client Observer E2E
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          results="${GITHUB_WORKSPACE}/build/e2e/results"
          mkdir -p build/e2e/server build/e2e/target build/e2e/observer "$results"
          rm -f "$results"/*

          printf 'eula=true\n' > build/e2e/server/eula.txt
          cat > build/e2e/server/server.properties <<'EOF'
          server-port=25570
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=4
          motd=Totem Observer E2E
          EOF

          # Resolve/compile once before the server join deadline exists. Two
          # concurrent Gradle runs contend for Loom's global cache and write the
          # same build/classes tree, so prepare immutable launch inputs first
          # and then start the Minecraft client JVMs directly in parallel.
          client_launch_cache="${GITHUB_WORKSPACE}/build/e2e/gradle-clients"
          launch_dir="${GITHUB_WORKSPACE}/build/e2e/launch"
          mkdir -p "$launch_dir"
          find "$launch_dir" -maxdepth 1 -type f \
            \( -name 'launch.cfg' -o -name 'runE2eTarget.args' -o -name 'runE2eObserver.args' \) \
            -delete
          ./gradlew -PtotemCoreJar="$core_jar" \
            -PtotemRemnantJar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.15.jar" \
            -PtotemAutomataJar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.17.jar" \
            -PtotemNexusJar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.5.jar" \
            -PtotemVillagersJar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.32.jar" \
            -PtotemLocksmithJar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.5.jar" \
            -Pe2eLaunchInputsDir="$launch_dir" \
            --project-cache-dir "$client_launch_cache" \
            prepareE2eClientLaunchInputs \
            --no-daemon --stacktrace

          launch_cfg="$launch_dir/launch.cfg"
          target_args="$launch_dir/runE2eTarget.args"
          observer_args="$launch_dir/runE2eObserver.args"
          java_bin="${JAVA_HOME}/bin/java"
          for required in "$launch_cfg" "$target_args" "$observer_args" "$java_bin"; do
            if [[ ! -s "$required" ]]; then
              echo "Missing prepared E2E launch input: $required" >&2
              exit 1
            fi
          done
          if ! grep -Fq 'fabric.defaultModDistributionNamespace=official' "$launch_cfg"; then
            echo 'Prepared E2E launch.cfg is not in the official namespace.' >&2
            exit 1
          fi
          if grep -Eqi 'org\.relativitymc|modern-yarn' "$launch_cfg" "$target_args" "$observer_args"; then
            echo 'Prepared E2E launch inputs contain stale mapped dependencies.' >&2
            exit 1
          fi
          if ! cmp -s "$target_args" "$observer_args"; then
            echo 'Target and Observer E2E classpath argfiles differ.' >&2
            exit 1
          fi
          for client_dir in build/e2e/target build/e2e/observer; do
            printf '%s\n' \
              'onboardAccessibility:false' \
              'skipMultiplayerWarning:true' \
              'tutorialStep:none' > "$client_dir/options.txt"
          done

          server_pid=''
          target_pid=''
          observer_pid=''
          cleanup() {
            set +e
            for pid in "$observer_pid" "$target_pid" "$server_pid"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            done
            for pid in "$observer_pid" "$target_pid" "$server_pid"; do
              if [[ -n "$pid" ]]; then
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT

          ./gradlew -PtotemCoreJar="$core_jar" \
            -PtotemRemnantJar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.15.jar" \
            -PtotemAutomataJar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.17.jar" \
            -PtotemNexusJar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.5.jar" \
            -PtotemVillagersJar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.32.jar" \
            -PtotemLocksmithJar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.5.jar" \
            --project-cache-dir "${GITHUB_WORKSPACE}/build/e2e/gradle-server" \
            runE2eServer --no-daemon --stacktrace > build/e2e/server.log 2>&1 &
          server_pid=$!

          ready=false
          for _ in $(seq 1 180); do
            if (echo > /dev/tcp/127.0.0.1/25570) >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'E2E server exited before opening port 25570.' >&2
              tail -n 200 build/e2e/server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'Timed out waiting for E2E server port 25570.' >&2
            tail -n 200 build/e2e/server.log >&2 || true
            exit 1
          fi

          (
            cd build/e2e/target
            exec xvfb-run -a "$java_bin" @"$target_args" \
              -Dfabric.dli.config="$launch_cfg" \
              -Dfabric.dli.env=client \
              -Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotClient \
              -Dtotem.observer.e2e.enabled=true \
              -Dtotem.observer.e2e.results="$results" \
              -Dtotem.observer.e2e.role=target \
              --sun-misc-unsafe-memory-access=allow \
              --enable-native-access=ALL-UNNAMED \
              -Dfile.encoding=UTF-8 \
              net.fabricmc.devlaunchinjector.Main --username Target
          ) > build/e2e/target.log 2>&1 &
          target_pid=$!

          # Start both clients from the same server-ready edge; all expensive
          # Gradle/Loom preparation completed before the first client can join.
          (
            cd build/e2e/observer
            exec xvfb-run -a "$java_bin" @"$observer_args" \
              -Dfabric.dli.config="$launch_cfg" \
              -Dfabric.dli.env=client \
              -Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotClient \
              -Dtotem.observer.e2e.enabled=true \
              -Dtotem.observer.e2e.results="$results" \
              -Dtotem.observer.e2e.role=observer \
              --sun-misc-unsafe-memory-access=allow \
              --enable-native-access=ALL-UNNAMED \
              -Dfile.encoding=UTF-8 \
              net.fabricmc.devlaunchinjector.Main --username Observer
          ) > build/e2e/observer.log 2>&1 &
          observer_pid=$!

          target_ready=false
          for _ in $(seq 1 180); do
            if compgen -G "$results/failure-*.txt" >/dev/null; then
              cat "$results"/failure-*.txt >&2 || true
              exit 1
            fi
            if [[ -f "$results/target-world-ready.txt" ]]; then
              target_ready=true
              break
            fi
            for spec in "$target_pid:target" "$observer_pid:observer"; do
              pid="${spec%%:*}"
              name="${spec##*:}"
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "E2E ${name} exited before Target stabilized in gameplay view." >&2
                tail -n 200 "build/e2e/${name}.log" >&2 || true
                exit 1
              fi
            done
            sleep 1
          done
          if [[ "$target_ready" != true ]]; then
            echo 'Timed out waiting for E2E Target gameplay view to stabilize.' >&2
            tail -n 200 build/e2e/target.log >&2 || true
            tail -n 200 build/e2e/observer.log >&2 || true
            exit 1
          fi

          complete=false
          for _ in $(seq 1 360); do
            if compgen -G "$results/failure-*.txt" >/dev/null; then
              echo 'Observer E2E reported a failure:' >&2
              cat "$results"/failure-*.txt >&2 || true
              exit 1
            fi

            # Includes 105 explicit late-family assertions: 15 semantic families x 7 lifecycle files.
            if [[ -f "$results/server-session-started.txt" \
               && -f "$results/target-world-ready.txt" \
               && -f "$results/target-native-state-enabled.txt" \
               && -f "$results/target-native-no-frame.txt" \
               && -f "$results/observer-native-state-ok.txt" \
               && -f "$results/observer-native-camera-ok.txt" \
               && -f "$results/observer-native-hud-ok.txt" \
               && -f "$results/observer-native-world-settled.txt" \
               && -f "$results/observer-native-world-saved.txt" \
               && -f "$results/observer-native-world.png" \
               && -f "$results/observer-native-hud.png" \
               && -f "$results/observer-ready-for-container.txt" \
               && -f "$results/target-native-container-opened.txt" \
               && -f "$results/target-native-container-state-sent.txt" \
               && -f "$results/observer-native-container-ok.txt" \
               && -f "$results/observer-native-container-saved.txt" \
               && -f "$results/observer-native-container.png" \
               && -f "$results/target-native-container-closed.txt" \
               && -f "$results/target-native-crafting-sender-priority-suppressed.txt" \
               && -f "$results/observer-native-crafting-mirror-priority-suppressed.txt" \
               && -f "$results/observer-ready-for-generic-screen.txt" \
               && -f "$results/target-native-generic-opened.txt" \
               && -f "$results/target-native-generic-no-frame.txt" \
               && -f "$results/observer-native-generic-screen-ok.txt" \
               && -f "$results/observer-native-generic-screen-saved.txt" \
               && -f "$results/observer-native-generic-screen.png" \
               && -f "$results/target-native-generic-closed.txt" \
               && -f "$results/observer-ready-for-merchant.txt" \
               && -f "$results/target-native-merchant-state-sent.txt" \
               && -f "$results/observer-native-merchant-ok.txt" \
               && -f "$results/observer-native-merchant-saved.txt" \
               && -f "$results/observer-native-merchant.png" \
               && -f "$results/target-native-merchant-close-sent.txt" \
               && -f "$results/observer-native-merchant-closed.txt" \
               && -f "$results/observer-ready-for-anvil.txt" \
