name: Publish Modrinth 0.1.14 Temp

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-modrinth-0.1.14-temp.yml]

permissions:
  contents: write

env:
  RELEASE_REF: e81b86615583d591580a146f48b77aa57f37f769
  CORE_REF: a8cedca207f9d4444ae4a52fd384ebd830fbd026
  MODULE_ID: totem-vanilla-tweaks
  VERSION: 0.1.14

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pinned VanillaTweaks 0.1.14
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: ${{ env.CORE_REF }}
          path: .lockstep/TotemCore
          persist-credentials: false
      - name: Build pinned 0.1.14 JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$VERSION"
          chmod +x gradlew .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore jar --no-daemon --stacktrace
          core="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core" = 0.7.2
          core_jar="$GITHUB_WORKSPACE/.lockstep/TotemCore/build/libs/totem-core-${core}.jar"
          test -f "$core_jar"
          ./gradlew -PtotemCoreJar="$core_jar" jar --no-daemon --stacktrace
          artifact="build/libs/totem-vanilla-tweaks-${VERSION}.jar"
          test -f "$artifact"
          unzip -p "$artifact" fabric.mod.json >/tmp/fabric.mod.json
          jq -e --arg id "$MODULE_ID" --arg v "$VERSION" --arg core '>=0.7.0 <0.8.0' '.id==$id and .version==$v and .depends["totem-core"]==$core' /tmp/fabric.mod.json >/dev/null
      - name: Publish and verify 0.1.14
        id: modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN"; test -n "$MODRINTH_PROJECT_ID"
          artifact="build/libs/totem-vanilla-tweaks-${VERSION}.jar"
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          sha="$(sha512sum "$artifact" | awk '{print $1}')"
          api=https://api.modrinth.com/v2
          args=(--fail --silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: Yunitrish006006/${MODULE_ID}-publisher/2.0")
          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}" >/tmp/project.json
          project="$(jq -er .id /tmp/project.json)"
          curl "${args[@]}" "$api/project/${project}/version?include_changelog=false" >/tmp/versions.json
          count="$(jq --arg v "$VERSION" '[.[]|select(.version_number==$v)]|length' /tmp/versions.json)"
          if [[ "$count" == 0 ]]; then
            data="$(jq -nc --arg n "${MODULE_ID} ${VERSION}" --arg v "$VERSION" --arg p "$project" --arg mc "$mc" '{name:$n,version_number:$v,changelog:"Finite skeleton ammunition now uses vanilla local-difficulty bonus chances with reduced arrow counts.",dependencies:[],game_versions:[$mc],version_type:"release",loaders:["fabric"],featured:false,status:"listed",project_id:$p,file_parts:["primary"],primary_file:"primary",environment:"client_and_server"}')"
            curl "${args[@]}" -X POST "$api/version" -F "data=${data};type=application/json" -F "primary=@${artifact};filename=$(basename "$artifact");type=application/java-archive" >/tmp/version.json
            id="$(jq -er .id /tmp/version.json)"
          else
            test "$count" = 1
            id="$(jq -er --arg v "$VERSION" '.[]|select(.version_number==$v)|.id' /tmp/versions.json)"
          fi
          curl "${args[@]}" "$api/version/$id" >/tmp/remote.json
          jq -e --arg p "$project" --arg v "$VERSION" --arg mc "$mc" --arg f "$(basename "$artifact")" --arg sha "$sha" '.project_id==$p and .version_number==$v and .game_versions==[$mc] and .loaders==["fabric"] and (([.files[]|select(.primary==true)][0]//.files[0]).filename==$f) and (([.files[]|select(.primary==true)][0]//.files[0]).hashes.sha512==$sha)' /tmp/remote.json >/dev/null
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha" >> "$GITHUB_OUTPUT"
      - name: Record verified publication on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ID: ${{ steps.modrinth.outputs.version_id }}
          SHA512: ${{ steps.modrinth.outputs.sha512 }}
        run: |
          set -euo pipefail
          marker=".github/staging/modrinth-published-${VERSION}.json"
          body="$(jq -n --arg v "$VERSION" --arg id "$VERSION_ID" --arg sha "$SHA512" --arg run "$GITHUB_RUN_ID" '{version:$v,modrinth_version_id:$id,sha512:$sha,verified_by_run:$run}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" -f message="release: record Modrinth ${VERSION}" -f content="$encoded" -f branch=main >/dev/null
