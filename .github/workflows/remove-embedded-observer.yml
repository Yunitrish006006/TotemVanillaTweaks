name: Remove Embedded Observer

on:
  push:
    branches:
      - refactor/remove-embedded-observer

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-embedded-observer
          fetch-depth: 0

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: f87cd10fe8aefce77925b9e75dad237f17f38966
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Remove embedded Observer ownership
        shell: bash
        run: |
          set -euo pipefail
          bash .github/migrations/remove-observer-manual-page.sh
          bash .github/migrations/remove-embedded-observer.sh

      - name: Build pinned TotemCore
        shell: bash
        run: |
          set -euo pipefail
          (cd .lockstep/TotemCore && ./gradlew assemble --no-daemon --stacktrace)

      - name: Compile gameplay-only VanillaTweaks
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.18.jar"
          ./gradlew -PtotemCoreJar="$core_jar" clean test assemble compileGametestJava --no-daemon --stacktrace

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.18.jar"
          ./gradlew -PtotemCoreJar="$core_jar" runGameTest --no-daemon --stacktrace

      - name: Run gameplay client GameTest
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.18.jar"
          xvfb-run -a ./gradlew -PtotemCoreJar="$core_jar" runClientGametest --no-daemon --stacktrace

      - name: Run production-namespace gameplay Client GameTest
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.18.jar"
          ./gradlew -PtotemCoreJar="$core_jar" runProductionClientGameTest --no-daemon --stacktrace

      - name: Enforce clean ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = '0.1.28'
          ! find src/main/java -type f -name 'Observer*.java' | grep -q .
          ! grep -R -n -E '/observeui|Observer(Server|Client)Runtime|dev\.totem\.vanillatweaks\.observer' src/main
          ! grep -R -n 'dev\.totem\.vanillatweaks.*Observer' src/test src/gametest 2>/dev/null
          test ! -d src/integrationGametest
          test ! -d src/e2e
          grep -Fq '"OptionsMixin"' src/main/resources/totem-vanilla-tweaks.client.mixins.json
          grep -Fq '"AbstractContainerScreenMixin"' src/main/resources/totem-vanilla-tweaks.client.mixins.json
          test "$(jq '.client | length' src/main/resources/totem-vanilla-tweaks.client.mixins.json)" = '2'
          ! grep -R -n 'vanilla_tweaks_manual.page.4' src/main

      - name: Commit gameplay-only module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lockstep
          rm -f .github/migrations/remove-embedded-observer.sh .github/migrations/remove-observer-manual-page.sh
          rmdir .github/migrations 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/remove-embedded-observer.yml'
          git diff --cached --stat
          git commit -m 'refactor: remove embedded Observer runtime'
          git push origin HEAD:refactor/remove-embedded-observer
