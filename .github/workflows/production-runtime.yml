name: Production Runtime

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out VanillaTweaks
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # A pre-non-remap build rewrote Fabric API access wideners inside the
          # shared Gradle dependency cache. A production namespace gate must
          # resolve pristine distribution artifacts exactly as a player does.
          cache-disabled: true

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: b0b57bc98a98140a1c12a660a33952ea61167278
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation compile dependency
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 6b54011195b81ec9a9a09146d162ba303ebd8ee4
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Check out pinned TotemRemnant
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemRemnant
          ref: a3f9231b50c6c55f03a8c145e80644bd6cff7021
          path: .lockstep/TotemRemnant
          persist-credentials: false

      - name: Check out pinned TotemAutomata
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemAutomata
          ref: b007eeb0ef0417804fe2abb25524842480419ae1
          path: .lockstep/TotemAutomata
          persist-credentials: false

      - name: Check out pinned TotemNexus
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemNexus
          ref: 781c4593b03c6d620c5bca575a69053612aef240
          path: .lockstep/TotemNexus
          persist-credentials: false

      - name: Check out pinned TotemVillagers
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemVillagers
          ref: c4d37815c45b86f102939ec5e43b171692a406e0
          path: .lockstep/TotemVillagers
          persist-credentials: false

      - name: Check out pinned TotemLocksmith
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemLocksmith
          ref: c89d380b88b10a3f0f55044e04266bc8ada70357
          path: .lockstep/TotemLocksmith
          persist-credentials: false

      - name: Build pinned Observer integration modules
        shell: bash
        run: bash .github/scripts/build-observer-integration-jars.sh

      - name: Enforce module-owned Observer screens
        shell: bash
        run: bash .github/scripts/check-owned-observer-screens.sh

      - name: Run cross-module production sender Client GameTest
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew \
            -PtotemCoreJar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.16.jar" \
            -PtotemRemnantJar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.16.jar" \
            -PtotemAutomataJar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.18.jar" \
            -PtotemNexusJar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.13.jar" \
            -PtotemVillagersJar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.33.jar" \
            -PtotemLocksmithJar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.6.jar" \
            runIntegrationClientGametest --no-daemon --stacktrace

      - name: Verify cross-module integration screenshots
        shell: bash
        run: |
          set -euo pipefail
          integration_screenshots="${GITHUB_WORKSPACE}/build/owner-present-integration-screenshots"
          count="$(find "$integration_screenshots" -maxdepth 1 -type f -name '*.png' | wc -l)"
          if [[ "$count" != 9 ]]; then
            echo "Expected exactly 9 owner-present screenshots; found $count." >&2
            exit 1
          fi

      - name: Upload cross-module integration screenshots
        uses: actions/upload-artifact@v4
        with:
          name: observer-owner-present-production-runtime-screenshots
          path: build/owner-present-integration-screenshots/*.png
          if-no-files-found: error

      - name: Run production-namespace client GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.16'
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./gradlew -PtotemCoreJar="$core_jar" runProductionClientGameTest --no-daemon --stacktrace
