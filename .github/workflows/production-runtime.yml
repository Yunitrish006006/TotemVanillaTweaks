name: Production Runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out TotemVanillaTweaks
        uses: actions/checkout@v4

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 424b90dc3929caa8c1afcfca7e63c50a64bde669
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build pinned TotemCore
        shell: bash
        run: |
          set -euo pipefail
          (cd .lockstep/TotemCore && ./gradlew assemble --no-daemon --stacktrace)

      - name: Run built-artifact gameplay Client GameTest
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.23.jar"
          export SDL_VIDEO_DRIVER=x11
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          ./gradlew -PtotemCoreJar="$core_jar" clean assemble runProductionClientGameTest --no-daemon --stacktrace

      - name: Inspect production artifact ownership
        shell: bash
        run: |
          set -euo pipefail
          jar_file="build/libs/totem-vanilla-tweaks-0.1.30.jar"
          test -f "$jar_file"
          if jar tf "$jar_file" | grep -E 'dev/totem/vanillatweaks/(observer/|network/Observer|client/Observer|mixin/.*/?Observer|mixin/Observer)'; then
            echo 'Embedded Observer classes remain in the VanillaTweaks artifact.' >&2
            exit 1
          fi
          ! unzip -p "$jar_file" fabric.mod.json | grep -q 'Observer View'
          ! unzip -p "$jar_file" totem-vanilla-tweaks.mixins.json | grep -q 'Observer'
          ! unzip -p "$jar_file" totem-vanilla-tweaks.client.mixins.json | grep -q 'Observer'
