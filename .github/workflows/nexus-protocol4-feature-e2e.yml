name: Nexus Protocol 4 Feature E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nexus-protocol4-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out VanillaTweaks
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Check out TotemCore 0.7.19
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 8573f7239e7faf6664a5c3ece58d79957f89a1bb
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out Observer integration modules
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Yunitrish006006/TotemExcavation.git .lockstep/TotemExcavation
          git -C .lockstep/TotemExcavation checkout f40b94fd5d9de8b47534343c76a95f62926d2b1b
          git clone --filter=blob:none --no-checkout https://github.com/Yunitrish006006/TotemRemnant.git .lockstep/TotemRemnant
          git -C .lockstep/TotemRemnant checkout 1d89395f93d8ea817947db4653919a11355eb548
          git clone --filter=blob:none --no-checkout https://github.com/Yunitrish006006/TotemAutomata.git .lockstep/TotemAutomata
          git -C .lockstep/TotemAutomata checkout cc4bdb022615faad73bc9e5c0ef6d52b9d0970e6
          git clone --filter=blob:none --no-checkout https://github.com/Yunitrish006006/TotemNexus.git .lockstep/TotemNexus
          git -C .lockstep/TotemNexus checkout 2d7f52150d17e5c7c7ead6905fb3629f7548ba77
          git clone --filter=blob:none --no-checkout https://github.com/Yunitrish006006/TotemVillagers.git .lockstep/TotemVillagers
          git -C .lockstep/TotemVillagers checkout 615f83c5c3534a40e6ae7a2a0713390512f8b64c
          git clone --filter=blob:none --no-checkout https://github.com/Yunitrish006006/TotemLocksmith.git .lockstep/TotemLocksmith
          git -C .lockstep/TotemLocksmith checkout 9e8e25d44887a33839dc2a3b92a424ca4b931e00

      - name: Build feature lockstep production JARs
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${GITHUB_WORKSPACE}/.lockstep/TotemCore/gradlew"
          chmod +x "$wrapper"
          "$wrapper" -p .lockstep/TotemCore jar --no-daemon --stacktrace
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.19.jar"
          test -f "$core_jar"

          "$wrapper" -p .lockstep/TotemExcavation -PtotemCoreJar="$core_jar" jar --no-daemon --stacktrace
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-0.1.13.jar"
          test -f "$excavation_jar"

          "$wrapper" -p .lockstep/TotemRemnant -PtotemCoreJar="$core_jar" remapJar --no-daemon --stacktrace
          remnant_jar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.21.jar"
          test -f "$remnant_jar"

          "$wrapper" -p .lockstep/TotemAutomata \
            -PtotemCoreJar="$core_jar" \
            -PtotemExcavationJar="$excavation_jar" \
            -PincludeTotemExcavationRuntime=false jar --no-daemon --stacktrace
          test -f "${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.24.jar"

          "$wrapper" -p .lockstep/TotemNexus -PtotemCoreJar="$core_jar" jar --no-daemon --stacktrace
          nexus_jar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.20.jar"
          test -f "$nexus_jar"
          unzip -p "$nexus_jar" fabric.mod.json | jq -e '.id == "totem-nexus" and .version == "0.3.20"' >/dev/null

          "$wrapper" -p .lockstep/TotemVillagers \
            -PtotemCoreJar="$core_jar" -PtotemRemnantJar="$remnant_jar" \
            jar --no-daemon --stacktrace
          test -f "${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.36.jar"

          "$wrapper" -p .lockstep/TotemLocksmith -PtotemCoreJar="$core_jar" jar --no-daemon --stacktrace
          test -f "${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.10.jar"

      - name: Run dedicated server + two clients through Nexus protocol 4
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.19.jar"
          remnant_jar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.21.jar"
          automata_jar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.24.jar"
          nexus_jar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.20.jar"
          villagers_jar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.36.jar"
          locksmith_jar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.10.jar"
          results="${GITHUB_WORKSPACE}/build/e2e/results"
          mkdir -p build/e2e/server build/e2e/target build/e2e/observer "$results"
          rm -f "$results"/*

          printf 'eula=true\n' > build/e2e/server/eula.txt
          cat > build/e2e/server/server.properties <<'EOF'
          server-port=25570
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=4
          motd=Totem Observer Nexus Protocol 4 E2E
          EOF

          launch_dir="${GITHUB_WORKSPACE}/build/e2e/launch"
          client_launch_cache="${GITHUB_WORKSPACE}/build/e2e/gradle-clients"
          mkdir -p "$launch_dir"
          ./gradlew \
            -PtotemCoreJar="$core_jar" \
            -PtotemRemnantJar="$remnant_jar" \
            -PtotemAutomataJar="$automata_jar" \
            -PtotemNexusJar="$nexus_jar" \
            -PtotemVillagersJar="$villagers_jar" \
            -PtotemLocksmithJar="$locksmith_jar" \
            -Pe2eLaunchInputsDir="$launch_dir" \
            --project-cache-dir "$client_launch_cache" \
            prepareE2eClientLaunchInputs --no-daemon --stacktrace

          launch_cfg="$launch_dir/launch.cfg"
          target_args="$launch_dir/runE2eTarget.args"
          observer_args="$launch_dir/runE2eObserver.args"
          java_bin="${JAVA_HOME}/bin/java"
          for required in "$launch_cfg" "$target_args" "$observer_args" "$java_bin"; do
            test -s "$required"
          done
          grep -Fq 'fabric.defaultModDistributionNamespace=official' "$launch_cfg"
          cmp -s "$target_args" "$observer_args"
          for client_dir in build/e2e/target build/e2e/observer; do
            printf '%s\n' 'onboardAccessibility:false' 'skipMultiplayerWarning:true' 'tutorialStep:none' > "$client_dir/options.txt"
          done

          server_pid=''
          target_pid=''
          observer_pid=''
          cleanup() {
            set +e
            for pid in "$observer_pid" "$target_pid" "$server_pid"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null || true; fi
            done
            for pid in "$observer_pid" "$target_pid" "$server_pid"; do
              if [[ -n "$pid" ]]; then wait "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          ./gradlew \
            -PtotemCoreJar="$core_jar" \
            -PtotemRemnantJar="$remnant_jar" \
            -PtotemAutomataJar="$automata_jar" \
            -PtotemNexusJar="$nexus_jar" \
            -PtotemVillagersJar="$villagers_jar" \
            -PtotemLocksmithJar="$locksmith_jar" \
            --project-cache-dir "${GITHUB_WORKSPACE}/build/e2e/gradle-server" \
            runE2eServer --no-daemon --stacktrace > build/e2e/server.log 2>&1 &
          server_pid=$!

          ready=false
          for _ in $(seq 1 180); do
            if (echo > /dev/tcp/127.0.0.1/25570) >/dev/null 2>&1; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 200 build/e2e/server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          [[ "$ready" == true ]]

          (
            cd build/e2e/target
            exec xvfb-run -a "$java_bin" @"$target_args" \
              -Dfabric.dli.config="$launch_cfg" \
              -Dfabric.dli.env=client \
              -Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotClient \
              -Dtotem.observer.e2e.enabled=true \
              -Dtotem.observer.e2e.results="$results" \
              -Dtotem.observer.e2e.role=target \
              -Dtotem.observer.e2e.nexus.protocol=4 \
              --sun-misc-unsafe-memory-access=allow \
              --enable-native-access=ALL-UNNAMED \
              -Dfile.encoding=UTF-8 \
              net.fabricmc.devlaunchinjector.Main --username Target
          ) > build/e2e/target.log 2>&1 &
          target_pid=$!

          (
            cd build/e2e/observer
            exec xvfb-run -a "$java_bin" @"$observer_args" \
              -Dfabric.dli.config="$launch_cfg" \
              -Dfabric.dli.env=client \
              -Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotClient \
              -Dtotem.observer.e2e.enabled=true \
              -Dtotem.observer.e2e.results="$results" \
              -Dtotem.observer.e2e.role=observer \
              -Dtotem.observer.e2e.nexus.protocol=4 \
              --sun-misc-unsafe-memory-access=allow \
              --enable-native-access=ALL-UNNAMED \
              -Dfile.encoding=UTF-8 \
              net.fabricmc.devlaunchinjector.Main --username Observer
          ) > build/e2e/observer.log 2>&1 &
          observer_pid=$!

          complete=false
          for _ in $(seq 1 540); do
            if compgen -G "$results/failure-*.txt" >/dev/null; then
              cat "$results"/failure-*.txt >&2 || true
              exit 1
            fi
            if [[ -f "$results/observer-native-nexus-compass-ok.txt" \
               && -f "$results/observer-native-nexus-recovery-compass-ok.txt" \
               && -f "$results/observer-native-nexus-recovery-compass-closed.txt" \
               && -f "$results/observer-native-nexus-map-ok.txt" \
               && -f "$results/observer-native-nexus-map.png" \
               && -f "$results/observer-native-nexus-management-ok.txt" \
               && -f "$results/observer-native-nexus-friends-ok.txt" \
               && -f "$results/observer-native-nexus-registration-ok.txt" \
               && -f "$results/target-native-nexus-close-sent.txt" \
               && -f "$results/observer-native-nexus-closed.txt" ]]; then
              complete=true
              break
            fi
            for spec in "$server_pid:server" "$target_pid:target" "$observer_pid:observer"; do
              pid="${spec%%:*}"
              name="${spec##*:}"
              if [[ -n "$pid" ]] && ! kill -0 "$pid" 2>/dev/null; then
                echo "Nexus protocol-4 E2E ${name} exited early." >&2
                tail -n 200 "build/e2e/${name}.log" >&2 || true
                exit 1
              fi
            done
            sleep 1
          done

          if [[ "$complete" != true ]]; then
            echo 'Timed out waiting for Nexus protocol-4 E2E markers.' >&2
            find "$results" -maxdepth 1 -type f -print -exec cat {} \; >&2 || true
            tail -n 200 build/e2e/server.log >&2 || true
            tail -n 200 build/e2e/target.log >&2 || true
            tail -n 200 build/e2e/observer.log >&2 || true
            exit 1
          fi
          echo 'Feature Nexus protocol-4 dedicated-server two-client Observer E2E passed.'

      - name: Upload protocol-4 E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-protocol4-feature-e2e
          path: |
            build/e2e/results/*
            build/e2e/*.log
          if-no-files-found: error
