name: Publish Modrinth

on:
  push:
    branches: [main]
    paths:
      - gradle.properties
      - .github/staging/modrinth-release-request.json
      - .github/workflows/publish-modrinth.yml
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit/tag to publish; defaults to the selected workflow ref
        required: false
        type: string
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean
      release_type:
        description: Modrinth release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: 'modrinth-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

env:
  MODULE_ID: totem-vanilla-tweaks
  # Match the minimum 0.7.x Core used by the normal build/E2E gate.
  CORE_REF: 82b21944b1e4865f5d34f13febc5049d936a636f
  RELEASE_REQUEST: .github/staging/modrinth-release-request.json
  FABRIC_API_PROJECT_ID: P7dR8mSH
  # The former first-party TotemCore project/version IDs are no longer public.
  # Keep this an exact external dependency instead of guessing a same-name project.
  TOTEM_CORE_DEPENDENCY_FILE: totem-core-0.7.11.jar

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out control ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release
        shell: bash
        env:
          EVENT_NAME: '${{ github.event_name }}'
          BEFORE_SHA: '${{ github.event.before }}'
          REQUESTED_REF: '${{ inputs.release_ref }}'
          REQUESTED_DRY_RUN: '${{ inputs.dry_run }}'
          REQUESTED_RELEASE_TYPE: '${{ inputs.release_type }}'
        run: |
          set -euo pipefail
          fail_release_source() {
            echo "Release source validation failed: $1" >&2
            exit 1
          }

          should_publish=false
          dry_run=false
          release_ref="$GITHUB_SHA"
          expected_version=""
          release_type=release

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            should_publish=true
            dry_run="${REQUESTED_DRY_RUN:-true}"
            release_type="${REQUESTED_RELEASE_TYPE:-release}"
            if [[ -n "${REQUESTED_REF:-}" ]]; then
              release_ref="$REQUESTED_REF"
            fi
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null || true)"

            if grep -Fxq "$RELEASE_REQUEST" <<<"$changed"; then
              [[ -f "$RELEASE_REQUEST" ]] \
                || fail_release_source 'changed release-request file is missing.'
              if ! release_ref="$(jq -er '.release_ref | strings | select(length > 0)' "$RELEASE_REQUEST")"; then
                fail_release_source 'release request has no non-empty release_ref.'
              fi
              if ! expected_version="$(jq -er '.version | strings | select(length > 0)' "$RELEASE_REQUEST")"; then
                fail_release_source 'release request has no non-empty version.'
              fi
              if ! dry_run="$(jq -er '.dry_run // false | booleans' "$RELEASE_REQUEST")"; then
                fail_release_source 'release request dry_run must be a boolean.'
              fi
              if ! release_type="$(jq -er '.release_type // "release" | strings | select(length > 0)' "$RELEASE_REQUEST")"; then
                fail_release_source 'release request has no valid release_type string.'
              fi
              should_publish=true
            elif grep -Fxq 'gradle.properties' <<<"$changed"; then
              current="$(sed -n 's/^mod_version=//p' gradle.properties)"
              previous="$(git show "${BEFORE_SHA}:gradle.properties" 2>/dev/null | sed -n 's/^mod_version=//p' || true)"
              if [[ -n "$current" && ( -z "$previous" || "$previous" != "$current" ) ]]; then
                should_publish=true
              fi
            fi
          fi

          case "$release_type" in
            release|beta|alpha) ;;
            *) fail_release_source "unsupported release_type ${release_type}." ;;
          esac

          if [[ "$should_publish" == true ]]; then
            if ! git cat-file -e "${release_ref}^{commit}"; then
              fail_release_source 'release_ref does not resolve to a commit.'
            fi
            version="$(git show "${release_ref}:gradle.properties" | sed -n 's/^mod_version=//p')"
            [[ -n "$version" ]] \
              || fail_release_source 'release_ref gradle.properties has no mod_version.'
            if [[ -n "$expected_version" ]]; then
              [[ "$version" == "$expected_version" ]] \
                || fail_release_source 'release request version does not match release_ref mod_version.'
            fi
          else
            version=""
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

      - name: Detect local Modrinth publisher
        id: publisher
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          MODRINTH_TOKEN: '${{ secrets.MODRINTH_TOKEN }}'
          MODRINTH_PROJECT_ID: '${{ secrets.MODRINTH_PROJECT_ID }}'
        run: |
          set -euo pipefail
          if [[ -n "$MODRINTH_TOKEN" && -n "$MODRINTH_PROJECT_ID" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Skip push without a local Modrinth publisher
        if: steps.release.outputs.should_publish == 'true' && github.event_name == 'push' && steps.publisher.outputs.available != 'true'
        shell: bash
        run: |
          echo 'No local Modrinth publisher is configured; this push-triggered publication is intentionally skipped.'
          echo 'Publication must be performed by the external TotemCore backfill workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Require a local Modrinth publisher for manual runs
        if: steps.release.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch' && steps.publisher.outputs.available != 'true'
        shell: bash
        run: |
          echo 'Manual Modrinth publication/verification requires both MODRINTH_TOKEN and MODRINTH_PROJECT_ID.' >&2
          exit 1

      - if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Release artifacts must never reuse historical dependency jars that
          # were mutated by the retired named-namespace normalization task.
          cache-disabled: true

      - name: Check out pinned release source
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: '${{ steps.release.outputs.release_ref }}'
          fetch-depth: 0

      - name: Check out pinned TotemCore
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: '${{ env.CORE_REF }}'
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation compile dependency
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 6b54011195b81ec9a9a09146d162ba303ebd8ee4
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Check out pinned TotemRemnant
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemRemnant
          ref: a8eb55ae53f3c6488775467127bab4d972c52a49
          path: .lockstep/TotemRemnant
          persist-credentials: false

      - name: Check out pinned TotemAutomata
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemAutomata
          ref: 59b80206768466a4ac96f89e1343849abaa82dd3
          path: .lockstep/TotemAutomata
          persist-credentials: false

      - name: Check out pinned TotemNexus
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemNexus
          ref: a1f00f4e70fcdbe9ee098c21ed0c997bdb130bcb
          path: .lockstep/TotemNexus
          persist-credentials: false

      - name: Check out pinned TotemVillagers
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemVillagers
          ref: d0d287e2df831a44b4b2cab28bbc98e396368cda
          path: .lockstep/TotemVillagers
          persist-credentials: false

      - name: Check out pinned TotemLocksmith
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemLocksmith
          ref: 9080ac2c37807b539c5d309fe833edb660834f3b
          path: .lockstep/TotemLocksmith
          persist-credentials: false

      - name: Build pinned Observer integration modules
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        shell: bash
        run: bash .github/scripts/build-observer-integration-jars.sh

      - name: Run release cross-module production sender Client GameTest
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew \
            -PtotemCoreJar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.11.jar" \
            -PtotemRemnantJar="${GITHUB_WORKSPACE}/.lockstep/TotemRemnant/build/libs/totem-remnant-0.2.15.jar" \
            -PtotemAutomataJar="${GITHUB_WORKSPACE}/.lockstep/TotemAutomata/build/libs/totem-automata-0.1.16.jar" \
            -PtotemNexusJar="${GITHUB_WORKSPACE}/.lockstep/TotemNexus/build/libs/totem-nexus-0.3.5.jar" \
            -PtotemVillagersJar="${GITHUB_WORKSPACE}/.lockstep/TotemVillagers/build/libs/totem-villagers-0.1.32.jar" \
            -PtotemLocksmithJar="${GITHUB_WORKSPACE}/.lockstep/TotemLocksmith/build/libs/totem-locksmith-0.1.5.jar" \
            runIntegrationClientGametest --no-daemon --stacktrace

      - name: Build release JAR
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_VERSION: '${{ steps.release.outputs.version }}'
        run: |
          set -euo pipefail
          fail_release_build() {
            echo "Release JAR validation failed: $1" >&2
            exit 1
          }

          actual_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ -n "$actual_version" ]] || fail_release_build 'gradle.properties has no mod_version.'
          [[ "$actual_version" == "$EXPECTED_VERSION" ]] \
            || fail_release_build 'checked-out mod_version does not match the resolved release version.'
          chmod +x gradlew .lockstep/TotemCore/gradlew
          core="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          [[ "$core" == 0.7.11 ]] \
            || fail_release_build 'pinned TotemCore checkout is not version 0.7.11.'
          core_jar="$GITHUB_WORKSPACE/.lockstep/TotemCore/build/libs/totem-core-${core}.jar"
          [[ -f "$core_jar" ]] \
            || fail_release_build 'pinned TotemCore production JAR is missing.'

          # Never accept a formal JAR left by an earlier task or retry. Minecraft
          # 26.2 uses the non-remapping Loom plugin, so `jar` is the production JAR.
          ./gradlew -PtotemCoreJar="$core_jar" clean jar --no-daemon --stacktrace
          a="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          [[ -n "$a" ]] || fail_release_build 'gradle.properties has no archives_base_name.'
          artifact="build/libs/${a}-${EXPECTED_VERSION}.jar"
          [[ -f "$artifact" ]] \
            || fail_release_build 'clean Gradle jar build did not produce the expected release artifact.'

      - name: Publish and verify
        id: modrinth
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        shell: bash
        env:
          DRY_RUN: '${{ steps.release.outputs.dry_run }}'
          EXPECTED_VERSION: '${{ steps.release.outputs.version }}'
          RELEASE_TYPE: '${{ steps.release.outputs.release_type }}'
          MODRINTH_TOKEN: '${{ secrets.MODRINTH_TOKEN }}'
          MODRINTH_PROJECT_ID: '${{ secrets.MODRINTH_PROJECT_ID }}'
        run: |
          set -euo pipefail
          fail_release() {
            echo "Modrinth publication validation failed: $1" >&2
            exit 1
          }

          v="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ -n "$v" ]] || fail_release 'gradle.properties has no mod_version.'
          [[ "$v" == "$EXPECTED_VERSION" ]] \
            || fail_release 'artifact version does not match the resolved release version.'
          a="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          [[ -n "$a" ]] || fail_release 'gradle.properties has no archives_base_name.'
          [[ -n "$mc" ]] || fail_release 'gradle.properties has no minecraft_version.'
          artifact="build/libs/${a}-${v}.jar"
          [[ -n "$MODRINTH_TOKEN" ]] || fail_release 'MODRINTH_TOKEN is not configured.'
          [[ -n "$MODRINTH_PROJECT_ID" ]] || fail_release 'MODRINTH_PROJECT_ID is not configured.'
          [[ -f "$artifact" ]] || fail_release 'expected release JAR is missing.'

          if ! unzip -p "$artifact" fabric.mod.json >/tmp/fabric.mod.json; then
            fail_release 'release JAR has no readable fabric.mod.json.'
          fi
          if ! jq -e --arg id "$MODULE_ID" --arg v "$v" --arg mc "~${mc}" --arg core '>=0.7.0 <0.8.0' \
            '.id==$id and .version==$v and .depends.minecraft==$mc and .depends["totem-core"]==$core' \
            /tmp/fabric.mod.json >/dev/null; then
            fail_release 'release JAR Fabric metadata does not match module, version, Minecraft, or TotemCore requirements.'
          fi

          api=https://api.modrinth.com/v2
          args=(--silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: Yunitrish006006/${MODULE_ID}-publisher/4.0")

          fetch_modrinth_json() {
            local label="$1"
            local path="$2"
            local output="$3"
            local expected_type="$4"
            local status

            if ! status="$(curl "${args[@]}" --output "$output" --write-out '%{http_code}' "$api/$path")"; then
              echo "Modrinth ${label} lookup failed before an HTTP response was received." >&2
              return 1
            fi
            if [[ "$status" != 200 ]]; then
              echo "Modrinth ${label} lookup returned HTTP ${status}." >&2
              return 1
            fi
            if ! jq -e --arg expected_type "$expected_type" 'type == $expected_type' "$output" >/dev/null; then
              echo "Modrinth ${label} lookup returned invalid JSON; expected ${expected_type}." >&2
              return 1
            fi
          }

          fetch_modrinth_json 'release project' "project/${MODRINTH_PROJECT_ID}" /tmp/project.json object
          if ! p="$(jq -er '.id | strings | select(length > 0)' /tmp/project.json)"; then
            fail_release 'release project response has no project ID.'
          fi
          if [[ "$p" != "$MODRINTH_PROJECT_ID" ]]; then
            fail_release 'release project lookup returned a different project identity.'
          fi
          if ! jq -e '.project_type == "mod"' /tmp/project.json >/dev/null; then
            fail_release 'configured Modrinth project is not a mod project.'
          fi
          if ! project_summary="$(jq -er '
              select((.title | type == "string" and length > 0)
                     and (.slug | type == "string" and length > 0)
                     and (.status | type == "string" and length > 0)
                     and (.requested_status == null
                          or (.requested_status | type == "string" and length > 0)))
              | "Modrinth release project: title=\(.title), slug=\(.slug), status=\(.status), requested_status=\(.requested_status // "none"), project_type=\(.project_type)."
            ' /tmp/project.json)"; then
            fail_release 'release project response is missing non-sensitive status metadata.'
          fi
          echo "$project_summary"

          if ! sha="$(sha512sum "$artifact" | awk '{print $1}')" \
              || [[ ! "$sha" =~ ^[0-9a-f]{128}$ ]]; then
            fail_release 'could not calculate a valid SHA-512 for the release JAR.'
          fi

          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_archive="$(sed -n 's/^archives_base_name=//p' .lockstep/TotemCore/gradle.properties)"
          [[ -n "$core_version" ]] || fail_release 'pinned TotemCore metadata has no mod_version.'
          [[ -n "$core_archive" ]] || fail_release 'pinned TotemCore metadata has no archives_base_name.'
          core_dependency_file="${core_archive}-${core_version}.jar"
          core_artifact=".lockstep/TotemCore/build/libs/${core_dependency_file}"
          if [[ "$core_dependency_file" != "$TOTEM_CORE_DEPENDENCY_FILE" || ! -f "$core_artifact" ]]; then
            fail_release 'pinned TotemCore artifact does not match required external file totem-core-0.7.11.jar.'
          fi

          fabric_project="$FABRIC_API_PROJECT_ID"
          if ! deps="$(jq -nce --arg fabric "$fabric_project" --arg core_file "$core_dependency_file" \
              '[{project_id:$fabric,dependency_type:"required"},{file_name:$core_file,dependency_type:"required"}]')"; then
            fail_release 'could not construct the exact Fabric API and TotemCore dependency metadata.'
          fi

          changelog_file=".github/staging/modrinth-changelog-${v}.md"
          if [[ -f "$changelog_file" ]]; then
            c="$(cat "$changelog_file")"
          else
            c="$(git log -1 --format=%B)"
          fi
          [[ -n "$c" ]] || fail_release 'release changelog is empty.'

          if [[ "$DRY_RUN" == true ]]; then
            echo "Validated Modrinth metadata for ${v} (${RELEASE_TYPE}); TotemCore external dependency=${core_dependency_file}."
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "sha512=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fetch_modrinth_json 'release versions' "project/${p}/version?include_changelog=false" /tmp/versions.json array
          if ! count="$(jq -er --arg v "$v" '[.[] | select(.version_number==$v)] | length' /tmp/versions.json)"; then
            fail_release 'could not count matching existing Modrinth versions.'
          fi

          if [[ "$count" == 1 ]]; then
            if ! id="$(jq -er --arg v "$v" '.[] | select(.version_number==$v) | .id | strings | select(length > 0)' /tmp/versions.json)"; then
              fail_release 'existing Modrinth version has no version ID.'
            fi
            if ! rsha="$(jq -er --arg v "$v" '.[] | select(.version_number==$v) | (([.files[] | select(.primary==true)][0] // .files[0]).hashes.sha512) | strings | select(length > 0)' /tmp/versions.json)"; then
              fail_release 'existing Modrinth version has no primary-file SHA-512.'
            fi
            if [[ "$rsha" != "$sha" ]]; then
              fail_release "version ${v} already exists with a different artifact SHA-512; refusing to overwrite it. Bump mod_version."
            fi
            echo "Modrinth version ${v} already exists with the expected release JAR; verifying its metadata."
          elif [[ "$count" != 0 ]]; then
            fail_release "found ${count} existing Modrinth versions numbered ${v}; expected at most one."
          else
            if ! data="$(jq -nce \
              --arg n "${MODULE_ID} ${v}" \
              --arg v "$v" \
              --arg c "$c" \
              --arg p "$p" \
              --arg mc "$mc" \
              --arg t "$RELEASE_TYPE" \
              --argjson deps "$deps" \
              '{name:$n,version_number:$v,changelog:$c,dependencies:$deps,game_versions:[$mc],version_type:$t,loaders:["fabric"],featured:false,status:"listed",project_id:$p,file_parts:["primary"],primary_file:"primary",environment:"client_and_server"}')"; then
              fail_release 'could not construct Modrinth version creation metadata.'
            fi
            if ! create_status="$(curl "${args[@]}" -X POST "$api/version" \
                -F "data=${data};type=application/json" \
                -F "primary=@${artifact};filename=$(basename "$artifact");type=application/java-archive" \
                --output /tmp/version.json --write-out '%{http_code}')"; then
              echo 'Modrinth version creation failed before an HTTP response was received.' >&2
              exit 1
            fi
            if [[ "$create_status" != 200 ]]; then
              echo "Modrinth version creation returned HTTP ${create_status}; TotemCore was declared as required external file ${core_dependency_file}." >&2
              exit 1
            fi
            if ! id="$(jq -er '.id | strings | select(length > 0)' /tmp/version.json)"; then
              fail_release 'Modrinth version creation response has no version ID.'
            fi
          fi

          fetch_modrinth_json 'published version' "version/${id}" /tmp/remote.json object
          if ! jq -e \
            --arg p "$p" \
            --arg v "$v" \
            --arg mc "$mc" \
            --arg f "$(basename "$artifact")" \
            --arg sha "$sha" \
            --arg t "$RELEASE_TYPE" \
            --arg fabric "$fabric_project" \
            --arg core_file "$core_dependency_file" \
            '.project_id==$p
             and .version_number==$v
             and .version_type==$t
             and .game_versions==[$mc]
             and .loaders==["fabric"]
             and (([.files[]|select(.primary==true)][0]//.files[0]).filename==$f)
             and (([.files[]|select(.primary==true)][0]//.files[0]).hashes.sha512==$sha)
             and (.dependencies | length)==2
             and ([.dependencies[] | select(.project_id==$fabric and .dependency_type=="required")] | length)==1
             and ([.dependencies[] | select(.file_name==$core_file
                                            and .project_id==null
                                            and .version_id==null
                                            and .dependency_type=="required")] | length)==1' \
            /tmp/remote.json >/dev/null; then
            echo "Published Modrinth metadata verification failed; expected exactly Fabric API plus required external ${core_dependency_file}." >&2
            exit 1
          fi

          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha" >> "$GITHUB_OUTPUT"

      - name: Record verified publication on main
        if: steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true' && steps.release.outputs.dry_run == 'false' && steps.modrinth.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          MOD_VERSION: '${{ steps.modrinth.outputs.version }}'
          VERSION_ID: '${{ steps.modrinth.outputs.version_id }}'
          SHA512: '${{ steps.modrinth.outputs.sha512 }}'
          RELEASE_TYPE: '${{ steps.release.outputs.release_type }}'
        run: |
          set -euo pipefail
          marker=".github/staging/modrinth-published-${MOD_VERSION}.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker}"
          body="$(jq -n --arg v "$MOD_VERSION" --arg id "$VERSION_ID" --arg sha "$SHA512" --arg run "$GITHUB_RUN_ID" --arg type "$RELEASE_TYPE" '{version:$v,release_type:$type,modrinth_version_id:$id,sha512:$sha,verified_by_run:$run}')"
          enc="$(printf '%s\n' "$body" | base64 -w0)"
          old="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | jq -r '.sha // empty')"
          payload="$(jq -n --arg m "release: record Modrinth ${MOD_VERSION}" --arg c "$enc" --arg b main --arg s "$old" 'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null

      - name: Record publication attempt on main
        if: always() && steps.release.outputs.should_publish == 'true' && steps.publisher.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          MOD_VERSION: '${{ steps.release.outputs.version }}'
          RELEASE_REF: '${{ steps.release.outputs.release_ref }}'
          RELEASE_TYPE: '${{ steps.release.outputs.release_type }}'
          JOB_STATUS: '${{ job.status }}'
          PUBLISH_OUTCOME: '${{ steps.modrinth.outcome }}'
        run: |
          set -euo pipefail
          marker=".github/staging/modrinth-attempt-${MOD_VERSION}.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker}"
          body="$(jq -n --arg v "$MOD_VERSION" --arg ref "$RELEASE_REF" --arg type "$RELEASE_TYPE" --arg run "$GITHUB_RUN_ID" --arg status "$JOB_STATUS" --arg publish "$PUBLISH_OUTCOME" '{version:$v,release_ref:$ref,release_type:$type,run:$run,status:$status,publish_step:$publish}')"
          enc="$(printf '%s\n' "$body" | base64 -w0)"
          old="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | jq -r '.sha // empty')"
          payload="$(jq -n --arg m "ci: record Modrinth attempt ${MOD_VERSION}" --arg c "$enc" --arg b main --arg s "$old" 'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null
